[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "ai-platform-reference-architecture"
version = "0.1.0"
description = "A reference architecture for a governed enterprise AI platform, kept as data and checked by architecture fitness functions."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Darshan Kumar Satpathy" }]
keywords = ["architecture", "fitness-functions", "ai-platform", "c4", "finops", "governance"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "License :: OSI Approved :: MIT License",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5", "mypy>=1.10", "pip-audit>=2.7"]

[project.scripts]
archfit = "archfit.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/archfit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::ResourceWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B011", "E501"]
"src/archfit/render.py" = ["E501"]
"src/archfit/rules.py" = ["E501"]
"src/archfit/model.py" = ["E501"]
"src/archfit/finops.py" = ["E501"]
"src/archfit/cli.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["archfit"]

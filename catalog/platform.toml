# Platform catalog: the single source of truth for the reference architecture.
# Everything in docs/generated is rendered from this file, and `archfit check` enforces the rules on it.
# SLO figures are DESIGN TARGETS for a reference design, not measurements of any real system.

[platform]
name = "Enterprise AI Platform"
version = "1.0.0"
description = "Reference architecture for a governed, multi-model AI platform."

[policy]
# Thresholds the fitness functions apply.
max_rto_minutes = { 1 = 60, 2 = 240 }
sync_availability_tolerance = 0.005
telemetry_required = ["traces", "metrics", "logs"]

# Data classification, lowest to highest sensitivity.
[[data_classes]]
id = "public"
level = 0

[[data_classes]]
id = "internal"
level = 1

[[data_classes]]
id = "confidential"
level = 2

[[data_classes]]
id = "restricted"
level = 3

# Layers and the layers each may depend on.
[[layers]]
id = "channels"
name = "Channels"
order = 1
may_depend_on = ["agents", "platform", "data", "foundation"]

[[layers]]
id = "agents"
name = "Agents"
order = 2
may_depend_on = ["platform", "foundation"]

[[layers]]
id = "platform"
name = "AI platform"
order = 3
may_depend_on = ["data", "foundation", "external"]

[[layers]]
id = "data"
name = "Data"
order = 4
may_depend_on = ["foundation"]

[[layers]]
id = "foundation"
name = "Foundation"
order = 5
may_depend_on = []

[[layers]]
id = "external"
name = "External"
order = 6
may_depend_on = []

# Teams and how to reach them.
[[teams]]
id = "platform-team"
responsibility = "Owns the AI gateway, routing, registries and agent runtime"
contact = "pagerduty:ai-platform-primary"

[[teams]]
id = "data-platform-team"
responsibility = "Owns data stores, ingestion and the catalog"
contact = "pagerduty:data-platform-primary"

[[teams]]
id = "security-team"
responsibility = "Owns identity, secrets, guardrail policy and model risk review"
contact = "pagerduty:security-oncall"

[[teams]]
id = "sre-team"
responsibility = "Owns observability, networking and delivery pipelines"
contact = "pagerduty:sre-primary"

[[teams]]
id = "ml-quality-team"
responsibility = "Owns evaluation, human review and quality gates"
contact = "pagerduty:ml-quality-business-hours"

[[teams]]
id = "product-teams"
responsibility = "Build the assistants and pipelines that use the platform"
contact = "pagerduty:product-oncall"

[[teams]]
id = "finops-team"
responsibility = "Owns cost allocation and unit economics"
contact = "slack:#finops"

[[teams]]
id = "vendor-management"
responsibility = "Owns model-provider and SaaS contracts"
contact = "slack:#vendor-mgmt"

